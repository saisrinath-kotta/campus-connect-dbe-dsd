services:
  # 1. FastAPI Python Backend Web Service
  - type: web
    name: campusconnect-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campusconnect-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.5

  # 2. React Vite Frontend Static Site
  - type: web
    name: campusconnect-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: campusconnect-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 3. Managed PostgreSQL Database
  - name: campusconnect-db
    databaseName: campusconnect
    user: postgres
    plan: free
